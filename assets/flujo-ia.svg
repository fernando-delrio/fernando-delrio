<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Flujo de trabajo con agentes: Yo, Spec y plan, Agente IA 1, Agente IA 2, Puertas, Máquina, y vuelve a mí para revisarlo">
  <title>Flujo de trabajo con agentes: Yo, Spec y plan, Agente IA 1, Agente IA 2, Puertas, Máquina, y vuelve a mí para revisarlo</title>
  <style>
    .paso { fill: #161b22; stroke: #30363d; stroke-width: 1.5; animation: encender 6.00s infinite both; }
    .titulo { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
    .detalle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
    .flecha { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6e7681; text-anchor: middle; }
    .retorno { fill: none; stroke: #D97757; stroke-width: 2; stroke-dasharray: 6 8; animation: fluir 1.2s linear infinite; }
    .nota { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    @keyframes encender { 0%, 22%, 100% { stroke: #30363d; } 6%, 14% { stroke: #D97757; } }
    @keyframes fluir { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .paso, .retorno { animation: none; } }
  </style><rect x=".5" y=".5" width="899" height="199" rx="20" fill="#0d1117" stroke="#30363d"/>
  <g transform="translate(28.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 0.00s"/>
    <text class="titulo" x="64" y="29">Yo</text>
    <text class="detalle" x="64" y="49">idea y criterio</text>
  </g>
  <g transform="translate(171.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 1.00s"/>
    <text class="titulo" x="64" y="29">Spec y plan</text>
    <text class="detalle" x="64" y="49">los apruebo yo</text>
  </g>
  <g transform="translate(314.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 2.00s"/>
    <text class="titulo" x="64" y="29">Agente IA 1</text>
    <text class="detalle" x="64" y="49">implementa y prueba</text>
  </g>
  <g transform="translate(457.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 3.00s"/>
    <text class="titulo" x="64" y="29">Agente IA 2</text>
    <text class="detalle" x="64" y="49">revisa y veta</text>
  </g>
  <g transform="translate(600.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 4.00s"/>
    <text class="titulo" x="64" y="29">Puertas</text>
    <text class="detalle" x="64" y="49">seguridad y WPO</text>
  </g>
  <g transform="translate(743.5 30)">
    <rect class="paso" width="128" height="66" rx="14" style="animation-delay: 5.00s"/>
    <text class="titulo" x="64" y="29">Máquina</text>
    <text class="detalle" x="64" y="49">lint, tests y CI</text>
  </g><text class="flecha" x="164" y="68">›</text><text class="flecha" x="307" y="68">›</text><text class="flecha" x="450" y="68">›</text><text class="flecha" x="593" y="68">›</text><text class="flecha" x="736" y="68">›</text>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97757"/></marker></defs>
  <path class="retorno" marker-end="url(#punta)" d="M807.5 100 V136 H92.5 V104"/>
  <text class="nota" x="450" y="162">vuelve a mí: leo el diff, decido y hago el commit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Flujo de trabajo con agentes: Yo, Spec, Plan y tareas, Implementer, Revisores, Hook de cierre, y vuelve a mí para revisarlo">
  <title>Flujo de trabajo con agentes: Yo, Spec, Plan y tareas, Implementer, Revisores, Hook de cierre, y vuelve a mí para revisarlo</title>
  <style>
    .paso { fill: #161b22; stroke: #30363d; stroke-width: 1.5; animation: encender 6.00s infinite both; }
    .titulo { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
    .detalle { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
    .flecha { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6e7681; text-anchor: middle; }
    .retorno { fill: none; stroke: #D97757; stroke-width: 2; stroke-dasharray: 6 8; animation: fluir 1.2s linear infinite; }
    .nota { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    @keyframes encender { 0%, 22%, 100% { stroke: #30363d; } 6%, 14% { stroke: #D97757; } }
    @keyframes fluir { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .paso, .retorno { animation: none; } }
  </style>
  <g transform="translate(4.5 24)">
    <rect class="paso" width="136" height="66" rx="14" style="animation-delay: 0.00s"/>

  </g>
  <g transform="translate(306.5 24)">
    <rect class="paso" width="136" height="66" rx="14" style="animation-delay: 2.00s"/>
    <text class="titulo" x="68" y="29">Plan y tareas</text>
    <text class="detalle" x="68" y="49">los apruebo yo</text>
  </g>
  <g transform="translate(457.5 24)">

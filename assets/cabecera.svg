<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Fernando Del Río. Software developer. Mantengo y escalo toolsequip.es. Asistente telefónico y chatbot, desde cero. Agentes de IA que escriben código como lo escribo yo.">
  <title>Fernando Del Río. Software developer. Mantengo y escalo toolsequip.es. Asistente telefónico y chatbot, desde cero. Agentes de IA que escriben código como lo escribo yo.</title>
  <style>
    .nombre { font: 800 46px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; text-anchor: middle; letter-spacing: -.5px; }
    .lema { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
    .frase { font: 500 20px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; fill: #79c0ff; text-anchor: middle;
      animation: mostrar 18.00s infinite both; }
    .escribir { transform-box: fill-box; transform-origin: left center;
      animation: escribir 18.00s infinite both; }
    .subrayado { transform-box: fill-box; transform-origin: center; animation: crecer 1.2s .3s cubic-bezier(.2, .8, .2, 1) both; }
    .luz { animation: derivar 14s ease-in-out infinite alternate; }
    .luz-2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes escribir { 0% { transform: scaleX(0); } 11.25%, 100% { transform: scaleX(1); } }
    @keyframes mostrar { 0%, 22.50% { opacity: 1; } 25.00%, 100% { opacity: 0; } }
    @keyframes crecer { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes derivar { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @media (prefers-reduced-motion: reduce) { .frase, .escribir, .subrayado, .luz { animation: none; } .frase:not(.frase-0) { display: none; } }
  </style>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="acento" x1="0" x2="1"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#3178C6"/></linearGradient>
    <filter id="desenfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="marco"><rect width="900" height="230" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="900" height="230" fill="url(#fondo)"/>
    <g filter="url(#desenfoque)" opacity=".45">
      <circle class="luz" cx="170" cy="50" r="90" fill="#D97757"/>
      <circle class="luz luz-2" cx="700" cy="190" r="100" fill="#3178C6"/>
    </g>
  </g>
  <rect width="899" height="229" x=".5" y=".5" rx="20" fill="none" stroke="#30363d"/>
  <text class="nombre" x="450" y="88">Fernando Del Río</text>
  <rect class="subrayado" x="380" y="106" width="140" height="3" rx="1.5" fill="url(#acento)"/>
  <text class="lema" x="450" y="200">Full stack · React + TypeScript · FastAPI · agentes de IA · El Bierzo (León)</text>
  <clipPath id="frase-0">
    <rect class="escribir" x="330" y="130" width="240" height="34" style="animation-delay: 0.00s; animation-timing-function: steps(18)"/>
  </clipPath>
  <text class="frase frase-0" x="450" y="154" clip-path="url(#frase-0)" style="animation-delay: 0.00s">Software developer</text>
  <clipPath id="frase-1">
    <rect class="escribir" x="252" y="130" width="396" height="34" style="animation-delay: 4.50s; animation-timing-function: steps(31)"/>
  </clipPath>
  <text class="frase frase-1" x="450" y="154" clip-path="url(#frase-1)" style="animation-delay: 4.50s">Mantengo y escalo toolsequip.es</text>
  <clipPath id="frase-2">
    <rect class="escribir" x="186" y="130" width="528" height="34" style="animation-delay: 9.00s; animation-timing-function: steps(42)"/>
  </clipPath>
  <text class="frase frase-2" x="450" y="154" clip-path="url(#frase-2)" style="animation-delay: 9.00s">Asistente telefónico y chatbot, desde cero</text>
  <clipPath id="frase-3">
    <rect class="escribir" x="126" y="130" width="648" height="34" style="animation-delay: 13.50s; animation-timing-function: steps(52)"/>
  </clipPath>
  <text class="frase frase-3" x="450" y="154" clip-path="url(#frase-3)" style="animation-delay: 13.50s">Agentes de IA que escriben código como lo escribo yo</text>
</svg>

      animation: aparecer 0.60s cubic-bezier(.2, .8, .2, 1) forwards, flotar 4s ease-in-out infinite; }
    .fondo { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; animation: brillo 2.70s ease-in-out infinite; }
    .nombre { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes brillo { 0%, 22%, 100% { stroke: #30363d; } 10% { stroke: var(--color); } }
    @media (prefers-reduced-motion: reduce) { .tarjeta, .fondo { animation: none; opacity: 1; } }
  </style>
